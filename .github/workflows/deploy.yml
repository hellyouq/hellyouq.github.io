name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suites
        run: |
          node tests/test-spec.mjs
          node tests/test-gemini.mjs
          node tests/check-classes.mjs

  deploy:
    name: Deploy
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Gemini API Key if secret or var is provided
        env:
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ secrets.GEMINI_KEY }}
          K3: ${{ secrets.API_KEY }}
          K4: ${{ vars.GEMINI_API_KEY }}
          K5: ${{ vars.GEMINI_KEY }}
          K6: ${{ vars.API_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const key = process.env.K1 || process.env.K2 || process.env.K3 || process.env.K4 || process.env.K5 || process.env.K6 || "";
            if (key && key.trim()) {
              let cfg = fs.readFileSync("js/config.js", "utf8");
              cfg = cfg.replace(/\x27DEMO_KEY\x27/, JSON.stringify(key.trim()));
              fs.writeFileSync("js/config.js", cfg);
              console.log("Gemini API key injected successfully into js/config.js");
            } else {
              console.log("No GEMINI_API_KEY secret or variable provided");
            }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
